<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kawaii - Dulcinea</title>
    <style>
        /* Cursor personalizado de corazón parpadeante */
        body {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23ffb6c1' stroke='%23da70d6' stroke-width='2' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>"), auto;
            background-color: #000000;
            background-image: radial-gradient(#d8b4fe 15%, transparent 16%), radial-gradient(#93c5fd 15%, transparent 16%), radial-gradient(#f472b6 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px, 15px 15px;
            color: #ffffff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Efecto de corazones cayendo */
        .heart-fall {
            position: fixed;
            top: -10vh;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        /* Contenedores de pantallas */
        .screen {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 15, 0.85);
            border: 3px solid #ffb6c1;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px #ffb6c1, inset 0 0 15px #d8b4fe;
            text-align: center;
        }

        /* Pantalla de Acceso */
        #login-screen h2 {
            color: #ffb6c1;
            text-shadow: 0 0 10px #f472b6;
        }
        .pass-info {
            background: rgba(216, 180, 254, 0.2);
            border: 2px dashed #d8b4fe;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            color: #d8b4fe;
        }
        input[type="password"] {
            width: 80%;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #f472b6;
            background: #000;
            color: #fff;
            text-align: center;
            font-size: 18px;
            outline: none;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(45deg, #f472b6, #d8b4fe);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px #f472b6;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #d8b4fe;
        }
        #error-msg {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* Panel Principal */
        #main-panel {
            display: none;
            max-width: 450px;
        }
        
        /* Foto de perfil con aro giratorio y parpadeo */
        .profile-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px dashed transparent;
            border-top-color: #38bdf8;
            border-right-color: #d8b4fe;
            border-bottom-color: #f472b6;
            border-left-color: #38bdf8;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            animation: blink-photo 2s infinite;
        }
        @keyframes blink-photo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .username {
            color: #d8b4fe;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .tagline {
            font-size: 14px;
            color: #ffb6c1;
            margin-bottom: 15px;
        }
        
        /* Estadísticas y Secciones */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .stat-box {
            background: rgba(255, 182, 193, 0.1);
            border: 1px solid #ffb6c1;
            border-radius: 10px;
            padding: 8px;
            font-size: 13px;
        }
        .stat-box span {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #d8b4fe;
        }

        .menu-links {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            background: rgba(216, 180, 254, 0.15);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #d8b4fe;
        }
        .menu-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .menu-links a:hover {
            color: #f472b6;
            text-shadow: 0 0 5px #f472b6;
        }
    </style>
</head>
<body>

    <div id="login-screen" class="screen">
        <h2>✨ Panel Dulcinea ✨</h2>
        <div class="pass-info">
            🔔 (5062) <br>
            Introduce la contraseña <span style="color: #d8b4fe;">Hechizera</span>:
        </div>
        <input type="password" id="pass-input" placeholder="••••">
        <br>
        <button onclick="checkPassword()">Entrar</button>
        <div id="error-msg">¡Contraseña incorrecta, intenta de nuevo! 💖</div>
    </div>

    <div id="main-panel" class="screen">
        <div class="profile-container">
            <div class="profile-ring"></div>
            <img src="https://xatimg.com/image/S39YqVhYkGOf.png" alt="Perfil Dulcinea" class="profile-pic">
        </div>
        
        <div class="username">@DulcineaHechizera ✦ Creadora ✨</div>
        <div class="tagline">Hechizando el mundo. Rincón mágico.</div>

        <div class="stats-grid">
            <div class="stat-box"><span>9999</span> Poder Mágico</div>
            <div class="stat-box"><span>15.8K</span> Seguidores</div>
            <div class="stat-box"><span>100% 💖</span> Amor</div>
        </div>

        <div class="menu-links">
            <a href="#">Perfil</a>
            <a href="#">Portafolio</a>
            <a href="#">Amigos</a>
            <a href="#">Relación</a>
        </div>
    </div>

    <script>
        // Lógica de contraseña
        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            if (pass === '5062') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
            } else {
                const error = document.getElementById('error-msg');
                error.style.display = 'block';
            }
        }

        // Generador de corazones cayendo dinámicos
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 350);
    </script>
</body>
</html>
