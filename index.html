<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulcinea - Rincón Mágico</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Lluvia de corazones Kawaii */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            top: -10vh;
            color: #ff69b4;
            font-size: 1.2rem;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Panel de Contraseña (Acceso Mágico) */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .login-box {
            background: #111;
            border: 2px solid #ff69b4;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.4);
            max-width: 350px;
            width: 90%;
        }

        .login-box h2 {
            color: #ff69b4;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #da70d6;
            background: #222;
            color: #da70d6;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            font-weight: bold;
        }

        .login-box button {
            background: linear-gradient(45deg, #ff69b4, #da70d6);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
        }

        .login-box button:hover {
            transform: scale(1.05);
        }

        .password-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .password-hint span {
            color: #da70d6;
            font-weight: bold;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Contenido Principal (Oculto hasta ingresar) */
        #main-content {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            margin: auto;
        }

        .profile-card {
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #ff69b4;
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(218, 112, 214, 0.3);
            backdrop-filter: blur(5px);
        }

        /* Contenedor de la foto con borde giratorio tricolor */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
        }

        .avatar-border {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(#87ceeb, #da70d6, #ffb6c1, #87ceeb);
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            animation: blink-border 1.5s infinite alternate;
        }

        @keyframes blink-border {
            0% { border-color: #ffffff; box-shadow: 0 0 10px #ffffff; }
            100% { border-color: #ff69b4; box-shadow: 0 0 20px #ff69b4; }
        }

        .profile-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .profile-title span {
            color: #da70d6;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: #ffb6c1;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Estadísticas */
        .stats-container {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 105, 180, 0.1);
            border-radius: 15px;
            padding: 15px 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        .stat-box h3 {
            font-size: 1.1rem;
            color: #ffffff;
        }

        .stat-box p {
            font-size: 0.85rem;
            color: #ffb6c1;
            margin-top: 3px;
        }

        /* Menú de Botones / Secciones */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #1a1a1a, #2a1b2e);
            border: 1.5px solid #da70d6;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-decoration: none;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #da70d6, #ff69b4);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(218, 112, 214, 0.4);
            color: #000;
        }

        .nav-btn i {
            color: #ff69b4;
        }

        .nav-btn:hover i {
            color: #000;
        }

        /* Reproductor con diseño integrado */
        .player-card {
            background: rgba(15, 15, 15, 0.9);
            border: 1.5px solid #87ceeb;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        .player-card h4 {
            color: #87ceeb;
            margin-bottom: 10px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ff69b4;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Reloj Hora Pacífico */
        .time-box {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #87ceeb;
        }
    </style>
</head>
<body>

    <!-- Lluvia de corazones -->
    <div class="hearts-container" id="hearts"></div>

    <!-- Panel de Contraseña / Acceso Mágico -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Hechizera</h2>
            <input type="password" id="pass-input" placeholder="••••" maxlength="6">
            <button onclick="checkPassword()">Entrar</button>
            <div class="error-msg" id="error-msg">Contraseña incorrecta, intenta de nuevo 💖</div>
            <div class="password-hint">
                <i class="fa-solid fa-bell"></i> Contraseña visible: <span style="color: #da70d6;">5062</span>
            </div>
        </div>
    </div>

    <!-- Contenido Principal de la Página -->
    <div id="main-content">
        <div class="profile-card">
            
            <!-- Foto de perfil con parpadeo y borde giratorio tricolor -->
            <div class="avatar-container">
                <div class="avatar-border"></div>
                <img src="https://xatimg.com/image/S39YqVhYkGOf.png" alt="Dulcinea" class="avatar">
            </div>

            <div class="profile-title">@DulcineaHechizera ✦ <span>Creadora</span></div>
            <div class="profile-subtitle">✨ Hechizando el mundo. Rincón mágico.</div>

            <!-- Estadísticas -->
            <div class="stats-container">
                <div class="stat-box">
                    <h3>9999</h3>
                    <p>Poder Mágico</p>
                </div>
                <div class="stat-box">
                    <h3>15.8K</h3>
                    <p>Seguidores</p>
                </div>
                <div class="stat-box">
                    <h3>100% 💖</h3>
                    <p>Amor</p>
                </div>
            </div>

            <!-- Menú de Secciones -->
            <div class="nav-menu">
                <a href="#perfil" class="nav-btn"><i class="fa-solid fa-user"></i> Perfil</a>
                <a href="#portafolio" class="nav-btn"><i class="fa-solid fa-briefcase"></i> Portafolio</a>
                <a href="#amigos" class="nav-btn"><i class="fa-solid fa-users"></i> Amigos</a>
                <a href="#relacion" class="nav-btn"><i class="fa-solid fa-heart"></i> Relación</a>
            </div>

            <!-- Reproductor de Música / Video -->
            <div class="player-card">
                <h4><i class="fa-solid fa-music"></i> Reproductor Mágico</h4>
                <div class="video-wrapper">
                    <!-- Se carga el enlace de YouTube solicitado -->
                    <iframe src="https://www.youtube.com/embed/F2NA8lr8FkQ?autoplay=1&mute=0&loop=1&playlist=F2NA8lr8FkQ" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>

            <!-- Hora Pacífico -->
            <div class="time-box" id="pacific-time">
                Hora Pacífico: Cargando...
            </div>

        </div>
    </div>

    <script>
        // Función para validar la contraseña (5062)
        function checkPassword() {
            const inputVal = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            const overlay = document.getElementById('login-overlay');
            const mainContent = document.getElementById('main-content');

            if (inputVal === '5062') {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    mainContent.style.display = 'block';
                }, 500);
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('pass-input').value = '';
            }
        }

        // Permitir entrar presionando Enter
        document.getElementById('pass-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Generar corazones cayendo dinámicamente
        function createHeart() {
            const heartsContainer = document.getElementById('hearts');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 1 + 0.8) + 'rem';
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 350);

        // Reloj en tiempo real para la Hora del Pacífico (America/Los_Angeles o PST/PDT)
        function updatePacificTime() {
            const options = {
                timeZone: 'America/Los_Angeles',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const timeString = new Date().toLocaleTimeString('es-US', options);
            document.getElementById('pacific-time').innerText = `🕒 Hora Pacífico: ${timeString}`;
        }
        setInterval(updatePacificTime, 1000);
        updatePacificTime();
    </script>
</body>
</html>
